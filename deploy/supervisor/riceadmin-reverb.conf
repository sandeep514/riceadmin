; Supervised Reverb WebSocket server for riceadmin.
; Without this, socket notifications work locally (where you run
; `php artisan reverb:start` by hand) but die on the server as soon as the
; terminal closes or the server restarts.
;
; INSTALL (on the server, adjust the path to the deployment's artisan):
;   sudo cp deploy/supervisor/riceadmin-reverb.conf /etc/supervisor/conf.d/riceadmin-reverb.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start riceadmin-reverb:*
; VERIFY:
;   sudo supervisorctl status riceadmin-reverb:*
;   sudo ss -tlnp | grep 6001        -- reverb must LISTEN on 0.0.0.0:6001
;   curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:6001/app/  -- expect 404/405 (reachable), not connection refused
;
; NOTE: browsers must reach Reverb through the Nginx /app proxy on 443
; (see docs/REACT_REVERB_SETUP.md), never 127.0.0.1:6001 directly.

[program:riceadmin-reverb]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/snjtradelink.com/staging/artisan reverb:start --host=0.0.0.0 --port=6001
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/snjtradelink.com/staging/storage/logs/reverb-worker.log
stopwaitsecs=30
