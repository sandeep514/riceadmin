; Supervised queue workers for riceadmin.
; Consumes the push-notification queue FIRST, then default.
; Without this, admin-blast pushes sit in `jobs` forever (FCM + inbox rows never happen).
;
; INSTALL (on the server, adjust the path to the deployment's artisan):
;   sudo cp deploy/supervisor/riceadmin-queue.conf /etc/supervisor/conf.d/riceadmin-queue.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start riceadmin-queue:*
; VERIFY:
;   sudo supervisorctl status riceadmin-queue:*
;   SELECT queue, COUNT(*) FROM jobs GROUP BY queue;   -- notifications should drain to 0

[program:riceadmin-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/snjtradelink.com/staging/artisan queue:work database --queue=notifications,default --sleep=3 --tries=3 --timeout=300 --max-jobs=500 --max-time=3600
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/snjtradelink.com/staging/storage/logs/queue-worker.log
stopwaitsecs=3600
